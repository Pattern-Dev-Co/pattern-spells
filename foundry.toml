[profile.default]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "write", path = "./reports" }
]
solc = "0.8.25"
ffi = true
evm_version = "cancun"
# forge >= 1.8 auto-generates a scoped remapping that compiles xchain-helpers against its own
# nested forge-std, so its `StdChains.Chain` becomes a different type from the one the test
# harness imports. Point that scope at the root forge-std so both resolve to the same type.
remappings = [
    "lib/xchain-helpers/:forge-std/=lib/forge-std/src/"
]

[etherscan]
mainnet = { key = "${MAINNET_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"